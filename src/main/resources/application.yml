spring:
  application:
    name: snippet_share
  datasource:
    url: jdbc:h2:file:./data/devdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
jwt:
  secret: a-random-long-and-strong-secret-key
  expiration: 86400000  # 24 hours in milliseconds

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload:
    dir: upload